<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hallmark Financial Bank — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
  rel="stylesheet"
/>

<link rel="icon" type="image/svg+xml" href="/Global-x-/assets/favicon-CjkZmihN.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/Global-x-/assets/icon-512-nV_-sgtN.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/Global-x-/assets/icon-512-nV_-sgtN.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="/Global-x-/assets/site-DGFW9KNJ.webmanifest" />
<meta name="theme-color" content="#10151F" />
  <link rel="stylesheet" crossorigin href="/Global-x-/assets/index-BNACRkeW.css">
</head>
<body>

  <div class="fx-ticker" id="fx-ticker">
    <div class="fx-ticker-track" id="fx-ticker-track">
      <span class="fx-ticker-item">Loading exchange rates…</span>
    </div>
  </div>

  <main class="login-page">
    <div class="login-panel">
      <div class="login-brand">
        <img src="/Global-x-/assets/icon-512-nV_-sgtN.png" alt="" />
        <div class="login-brand-text">
          <p class="login-brand-name">Hallmark</p>
          <p class="login-brand-sub">FINANCIAL BANK</p>
        </div>
      </div>

      <p class="login-title" id="login-title">Welcome back</p>
      <p class="login-sub" id="login-sub">Log in with your email — we'll send you a one-time code.</p>

      <form id="request-code-form">
        <div class="field"><label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
        </div>
        <button class="submit-btn" type="submit" id="request-code-btn">Send code</button>
      </form>

      <p class="auth-toggle-line" id="toggle-to-signup-line">
        New here?
        <button type="button" id="show-signup" style="background:none;border:none;color:var(--gold-soft);cursor:pointer;padding:0;text-decoration:underline;">Create an account</button>
      </p>

      <form id="signup-form" hidden>
        <div class="field"><label for="signup-first-name">First name</label>
          <input id="signup-first-name" type="text" required />
        </div>
        <div class="field"><label for="signup-last-name">Last name</label>
          <input id="signup-last-name" type="text" required />
        </div>
        <div class="field"><label for="signup-country">Country</label>
          <select id="signup-country">
            <option value="USA">United States (USD)</option>
            <option value="UK">United Kingdom (GBP)</option>
            <option value="Germany">Germany (EUR)</option>
          </select>
        </div>
        <div class="field"><label for="signup-email">Email</label>
          <input id="signup-email" type="email" autocomplete="email" required />
        </div>
        <button class="submit-btn" type="submit" id="signup-btn">Create account &amp; send code</button>
        <button class="link-btn" type="button" id="back-to-login-from-signup" style="background:none;border:none;color:var(--muted-invert);cursor:pointer;margin-top:10px;">Already have an account? Log in</button>
      </form>

      <form id="verify-code-form" hidden>
        <div class="field"><label for="login-code">6-digit code</label>
          <input id="login-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <p class="helper-text" id="code-timer"></p>
        <button class="submit-btn" type="submit" id="verify-code-btn">Verify &amp; log in</button>
        <button class="link-btn" type="button" id="resend-code" hidden style="background:none;border:none;color:var(--gold-soft);cursor:pointer;margin-top:10px;">Send a new code</button>
        <button class="link-btn" type="button" id="back-to-email" style="background:none;border:none;color:var(--muted-invert);cursor:pointer;margin-top:10px;">Use a different email</button>
      </form>

      <p class="form-error" id="login-error" hidden></p>
      <div id="login-status" class="login-status"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
