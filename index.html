<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hallmark Financial Bank — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />

<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icon-512.png" />
<link rel="shortcut icon" href="favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#10151F" />
</head>
<body>

  <div class="sandbox-banner">Demo / sandbox — no real money, accounts, or cards are involved.</div>

  <main class="login-page">
    <div class="login-panel">
      <div class="login-brand">
        <img src="icon-512.png" alt="" />
        <div class="login-brand-text">
          <p class="login-brand-name">Hallmark</p>
          <p class="login-brand-sub">FINANCIAL BANK</p>
        </div>
      </div>

      <p class="login-title">Welcome back</p>
      <p class="login-sub">Log in to view your account.</p>

      <form id="login-form">
        <div class="field"><label for="login-id">Email or username</label>
          <input id="login-id" type="text" autocomplete="username" required />
        </div>
        <div class="field"><label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <p class="form-error" id="login-error" hidden></p>
        <button class="submit-btn" type="submit" id="login-submit">Log in</button>
      </form>

      <div id="login-status" class="login-status"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
