<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hallmark Financial Bank — Verify your identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../../assets/css/styles.css" />
<link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
<meta name="theme-color" content="#10151F" />
</head>
<body>

  <main class="login-page">
    <div class="login-panel" style="text-align:center;">
      <div class="login-brand" style="justify-content:center;">
        <img src="../../icon-512.png" alt="" />
        <div class="login-brand-text" style="text-align:left;">
          <p class="login-brand-name">Hallmark</p>
          <p class="login-brand-sub">FINANCIAL BANK</p>
        </div>
      </div>

      <p class="login-title">Verify your identity</p>
      <p class="login-sub">Identity verification (KYC) is coming in a later phase, for now this step is skipped.</p>

      <button class="submit-btn" type="button" id="continue-btn">Continue to Dashboard</button>
    </div>
  </main>

  <script>
    document.getElementById("continue-btn").addEventListener("click", () => {
      window.location.href = "../../dashboard/";
    });
  </script>
</body>
</html>
